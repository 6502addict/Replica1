MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, define = yes;
    STACK:  start = $0100, size = $0100, type = rw, define = yes;
    RAM:    start = $0200, size = $B600, type = rw, define = yes;  # $0200-$B7FF (BSS)
    RAMHI:  start = $B800, size = $0800, type = rw, define = yes;  # $B800-$BFFF (DATA run)
    ROM:    start = $C000, size = $3000, type = ro, define = yes;  # $C000-$EFFF (12KB)
    # I/O at $F000-$F0FF (hardware, not defined)
    # Wozmon at $FF00-$FFFF (separate build)
}

SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    STARTUP:  load = ROM,    type = ro;
    CODE:     load = ROM,    type = ro;
    RODATA:   load = ROM,    type = ro;
    DATA:     load = ROM,    run = RAMHI, type = rw, define = yes;
    BSS:      load = RAM,    type = bss, define = yes;
}